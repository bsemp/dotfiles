---
name: Test

on:
  pull_request:
    paths:
      - playbooks/**
      - roles/**
      - ".github/workflows/*"

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6

      - name: Set up python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # ratchet:actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Create virtual environment
        run: |
          uv venv .venv --prompt "dotfiles_venv"

      - name: Install dependencies
        run: |
          # uv will install dependencies from restored cache if any
          uv sync --locked --all-extras

      - name: Run lint
        run: uv run ansible-lint

  deploy:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # ratchet:Homebrew/actions/setup-homebrew@master
        with:
          core: true
          cask: true

      - name: Set up python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # ratchet:actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Create virtual environment
        run: |
          uv venv .venv --prompt "dotfiles_venv"

      - name: Install dependencies
        run: |
          # uv will install dependencies from restored cache if any
          uv sync --frozen

      - name: Cleanup Runner before install
        run: |
          rm -rf ${HOME}/.azure

      - name: Install playbook
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          uv run ansible-playbook playbooks/main.yml -vv
